<!doctype html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grammar Review · S20–24</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
:root{
  --bg:#0f1116; --panel:#181b22; --panel2:#20242e; --line:#2a2f3b;
  --ink:#eceef4; --muted:#98a0b0; --dim:#666e7e;
  --acc:#5b8def; --acc-soft:color-mix(in srgb,var(--acc) 15%,transparent);
  --good:#22c58b; --bad:#f0576a;
  --shadow:0 10px 30px rgba(0,0,0,.35);
  --r:16px; --maxw:680px;
}
:root[data-theme="light"]{
  --bg:#f5f6f9; --panel:#ffffff; --panel2:#f1f3f7; --line:#e4e7ee;
  --ink:#1a1d26; --muted:#5c6472; --dim:#a4abb8;
  --good:#0fa871; --bad:#e0455a;
  --shadow:0 10px 30px rgba(30,40,70,.09);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  background:var(--bg);color:var(--ink);
  font-family:"Pretendard Variable",Pretendard,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
  display:flex;justify-content:center;transition:background .3s,color .3s;
}
.blob{position:fixed;top:-30%;left:50%;transform:translateX(-50%);width:90vw;height:60vh;z-index:0;pointer-events:none;
  background:radial-gradient(closest-side,var(--acc-soft),transparent 72%);filter:blur(20px);opacity:.7;transition:background .4s}
h1,h2,.disp{font-family:"Bricolage Grotesque",var(--pret),sans-serif}

.app{position:relative;z-index:1;width:100%;max-width:var(--maxw);min-height:100dvh;padding:14px 16px 36px;display:flex;flex-direction:column}

/* top bar */
.top{display:flex;align-items:center;gap:10px;height:38px;margin-bottom:10px}
.logo{font-family:"Bricolage Grotesque";font-weight:800;font-size:16px;letter-spacing:-.02em}
.logo b{color:var(--acc)}
.top .grow{flex:1}
.iconbtn{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--muted);
  cursor:pointer;font-size:15px;display:grid;place-items:center;transition:.15s}
.iconbtn:hover{color:var(--ink);border-color:var(--acc)}

/* HUD */
.hud{display:none;align-items:center;gap:10px;margin-bottom:12px;font-weight:700;font-size:13px}
.hud .stage{display:inline-flex;align-items:center;gap:6px;color:var(--ink)}
.hud .stage .e{font-size:16px}
.hud .grow{flex:1}
.hud .cnt{color:var(--muted)}
.hud .cnt b{color:var(--ink)}
.hud .streak{color:var(--acc);opacity:0;transition:.2s}
.hud .streak.on{opacity:1}
.bar{height:6px;border-radius:99px;background:var(--panel2);overflow:hidden;margin-bottom:16px;display:none}
.bar>i{display:block;height:100%;width:0;border-radius:99px;background:var(--acc);transition:width .4s cubic-bezier(.3,.9,.3,1)}

/* screens */
.screen{display:none;flex:1;flex-direction:column}
.screen.on{display:flex;animation:up .4s cubic-bezier(.2,.9,.2,1)}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* start */
.hero{text-align:center;margin-top:9vh}
.hero .kick{font-weight:800;color:var(--acc);letter-spacing:.14em;font-size:12px;text-transform:uppercase}
.hero h1{font-size:clamp(38px,10vw,62px);line-height:1.02;margin:12px 0 6px;letter-spacing:-.03em}
.hero p{color:var(--muted);font-weight:600;margin:0}
.hero p b{color:var(--ink)}
.stagelist{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-width:340px;margin:34px auto 0}
.sl{display:flex;align-items:center;gap:9px;padding:12px 14px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-weight:700;font-size:14px}
.sl .num{font-family:"Bricolage Grotesque";font-weight:800;color:var(--dim);font-size:12px;width:12px}
.sl i{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.startzone{margin-top:auto;padding-top:18px}
.startzone .btn{max-width:320px;margin:0 auto;display:block}
.dbg{position:fixed;left:14px;bottom:14px;z-index:30;display:none;padding:10px 14px;border-radius:10px;border:1px dashed var(--acc);
  background:var(--panel);color:var(--acc);font-weight:800;font-size:12px;cursor:pointer;font-family:inherit}

/* buttons */
.btn{appearance:none;border:0;cursor:pointer;font-family:inherit;font-weight:700;border-radius:13px;padding:15px 22px;font-size:16px;
  color:#fff;background:var(--acc);box-shadow:0 4px 14px color-mix(in srgb,var(--acc) 35%,transparent);transition:transform .1s,filter .1s;width:100%}
.btn:hover{filter:brightness(1.06)}.btn:active{transform:translateY(1px)}
.btn.sec{background:var(--panel);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.row{display:flex;gap:10px}

/* question */
.qhead{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.tag{font-weight:800;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--acc);
  background:var(--acc-soft);padding:5px 10px;border-radius:99px}
.qhead .n{margin-left:auto;color:var(--dim);font-weight:700;font-size:13px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:22px 20px;box-shadow:var(--shadow)}
.prompt{color:var(--muted);font-weight:600;font-size:14px;margin:0 0 14px}
.sent{font-size:clamp(19px,5vw,24px);font-weight:700;line-height:1.45;letter-spacing:-.01em;word-break:keep-all}
.sent .bk{display:inline-block;min-width:56px;text-align:center;border-bottom:2.5px dashed var(--acc);color:var(--acc);padding:0 6px}
.sent .bk.fill{color:var(--good);border-bottom-color:var(--good);border-style:solid}
.ko{font-size:19px;font-weight:700;margin-bottom:14px;letter-spacing:-.01em}

/* options */
.opts{display:grid;gap:9px;margin-top:14px}
.opt{appearance:none;text-align:left;cursor:pointer;font-family:inherit;font-weight:600;font-size:16px;color:var(--ink);
  background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:14px 15px;transition:.12s;display:flex;align-items:center;gap:11px}
.opt:hover{border-color:var(--acc)}
.opt .k{font-weight:800;font-size:12px;color:var(--dim);min-width:14px}
.opt.correct{border-color:var(--good);background:color-mix(in srgb,var(--good) 12%,var(--panel))}
.opt.correct .k{color:var(--good)}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--panel));animation:shake .35s}
.opt.mute{opacity:.4}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* listen */
.listen{display:flex;flex-direction:column;align-items:center;gap:10px;padding:6px 0 2px}
.spk{width:82px;height:82px;border-radius:50%;border:2px solid var(--acc);background:var(--acc-soft);color:var(--acc);font-size:32px;
  cursor:pointer;display:grid;place-items:center;transition:.12s}
.spk:active{transform:scale(.94)}
.spk.play{animation:ring 1s ease infinite}
@keyframes ring{0%,100%{box-shadow:0 0 0 0 var(--acc-soft)}50%{box-shadow:0 0 0 12px transparent}}
.listen .h{font-weight:600;color:var(--muted);font-size:13px}

/* tiles / build */
.tray{min-height:54px;display:flex;flex-wrap:wrap;gap:7px;padding:11px;border-radius:12px;background:var(--panel2);border:1.5px dashed var(--line);margin-bottom:11px}
.tray:empty::after{content:"단어를 순서대로 선택";color:var(--dim);font-weight:600;font-size:13.5px}
.bank{display:flex;flex-wrap:wrap;gap:7px}
.tile{cursor:pointer;font-weight:700;font-size:15px;padding:10px 13px;border-radius:10px;background:var(--panel);border:1.5px solid var(--line);color:var(--ink);transition:.1s}
.tile:hover{border-color:var(--acc)}.tile:active{transform:scale(.95)}
.tile.used{opacity:.28;pointer-events:none}
.tray .tile{background:var(--acc-soft);border-color:color-mix(in srgb,var(--acc) 40%,transparent)}

/* mistake tokens */
.tokens{font-size:clamp(19px,5vw,24px);font-weight:700;line-height:1.75;word-break:keep-all}
.tok{cursor:pointer;padding:1px 5px;border-radius:6px;transition:.1s}
.tok:hover{background:var(--acc-soft)}
.tok.hit{background:color-mix(in srgb,var(--bad) 18%,transparent);text-decoration:line-through;text-decoration-color:var(--bad);color:var(--bad)}
.tok.miss{color:var(--bad);opacity:.5;text-decoration:underline wavy var(--bad)}
.mfix{margin-top:13px;font-weight:700;font-size:16px;color:var(--good);opacity:0;transition:.3s}
.mfix.on{opacity:1}.mfix s{color:var(--bad);opacity:.75;margin-right:6px}

/* match */
.match{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.mcol{display:flex;flex-direction:column;gap:9px}
.mitem{cursor:pointer;font-weight:700;font-size:14.5px;padding:13px 11px;border-radius:11px;background:var(--panel);border:1.5px solid var(--line);
  transition:.12s;text-align:center;word-break:keep-all;min-height:52px;display:grid;place-items:center}
.mitem:hover{border-color:var(--acc)}
.mitem.sel{border-color:var(--acc);background:var(--acc-soft)}
.mitem.done{border-color:var(--good);background:color-mix(in srgb,var(--good) 12%,var(--panel));pointer-events:none}
.mitem.nope{animation:shake .35s;border-color:var(--bad)}

/* sort */
.pool{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px;min-height:20px}
.sortitem{cursor:pointer;font-weight:700;font-size:14px;padding:10px 12px;border-radius:10px;background:var(--panel);border:1.5px solid var(--line);transition:.1s;word-break:keep-all}
.sortitem:hover{border-color:var(--acc)}.sortitem.sel{border-color:var(--acc);background:var(--acc-soft)}
.buckets{display:grid;gap:9px}
.bucket{border:1.5px dashed var(--line);border-radius:12px;padding:11px;min-height:66px;transition:.12s;background:var(--panel2)}
.bucket:hover{border-color:var(--acc)}
.bucket.flash{animation:shake .35s;border-color:var(--bad)}
.bucket .bl{font-weight:800;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}
.bucket .drops{display:flex;flex-wrap:wrap;gap:6px}
.bucket .sortitem.locked{background:color-mix(in srgb,var(--good) 12%,var(--panel));border-color:var(--good);pointer-events:none}

/* feedback + nav */
.fb{margin-top:14px;border-radius:13px;padding:14px 15px;font-weight:600;display:none}
.fb.on{display:block;animation:up .25s}
.fb.ok{background:color-mix(in srgb,var(--good) 10%,var(--panel));border:1px solid color-mix(in srgb,var(--good) 40%,transparent)}
.fb.no{background:color-mix(in srgb,var(--bad) 9%,var(--panel));border:1px solid color-mix(in srgb,var(--bad) 40%,transparent)}
.fb .h{font-weight:800;font-size:15px;margin-bottom:4px}
.fb.ok .h{color:var(--good)}.fb.no .h{color:var(--bad)}
.fb .why{color:var(--muted);font-size:14px;line-height:1.55}.fb .why b{color:var(--ink)}
.nav{margin-top:auto;padding-top:14px;display:flex;gap:10px;align-items:center}
.nav .back{width:auto;flex:0 0 auto;padding:15px 18px}
.nav .fwd{flex:1}

/* review recap (back nav) */
.recap{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow)}
.recap .q{font-weight:700;font-size:18px;line-height:1.4;word-break:keep-all;margin-bottom:14px}
.recap .line{display:flex;gap:9px;align-items:flex-start;font-weight:600;font-size:15px;margin:7px 0}
.recap .line .ic{flex:0 0 auto;font-size:15px}
.recap .a-ok{color:var(--good)}.recap .a-no{color:var(--bad)}
.recap .why{color:var(--muted);font-size:14px;line-height:1.55;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.recap .why b{color:var(--ink)}
.badge{display:inline-block;font-weight:800;font-size:11px;padding:4px 9px;border-radius:99px;margin-bottom:12px}
.badge.ok{background:color-mix(in srgb,var(--good) 14%,transparent);color:var(--good)}
.badge.no{background:color-mix(in srgb,var(--bad) 12%,transparent);color:var(--bad)}

/* stage clear */
.overlay{position:fixed;inset:0;z-index:20;display:none;place-items:center;padding:22px;background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(7px)}
.overlay.on{display:grid;animation:up .3s}
.clear{width:100%;max-width:380px;text-align:center;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:28px 24px;box-shadow:0 24px 60px rgba(0,0,0,.35)}
.clear .big{font-family:"Bricolage Grotesque";font-weight:800;font-size:26px;letter-spacing:-.02em}
.clear .ring{width:112px;height:112px;margin:18px auto 12px;border-radius:50%;display:grid;place-items:center;position:relative}
.clear .ring b{font-size:30px;font-weight:800}.clear .ring span{position:absolute;bottom:20px;font-size:11px;color:var(--muted);font-weight:700}
.clear .sub{color:var(--muted);font-weight:600;margin-bottom:18px}.clear .sub b{color:var(--ink)}

/* results */
.res h2{font-size:28px;letter-spacing:-.02em;margin:2vh 0 0}
.res .lead{color:var(--muted);font-weight:600;margin:6px 0 18px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px 12px;text-align:center}
.kpi .v{font-family:"Bricolage Grotesque";font-weight:800;font-size:24px;letter-spacing:-.02em}
.kpi .l{color:var(--muted);font-weight:700;font-size:11px;margin-top:5px;text-transform:uppercase;letter-spacing:.04em}
.sec-t{font-weight:800;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:6px 0 10px}
.sbars{display:flex;flex-direction:column;gap:9px;margin-bottom:22px}
.sbar{display:flex;align-items:center;gap:10px;font-weight:700;font-size:13px}
.sbar .nm{width:96px;flex:0 0 auto;display:flex;align-items:center;gap:6px}
.sbar .track{flex:1;height:9px;border-radius:99px;background:var(--panel2);overflow:hidden}
.sbar .track i{display:block;height:100%;border-radius:99px}
.sbar .pc{width:52px;text-align:right;flex:0 0 auto;color:var(--muted)}
.review{display:flex;flex-direction:column;gap:8px;margin-bottom:22px}
.rev{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--bad);border-radius:10px;padding:12px 14px}
.rev .q{font-weight:700;font-size:14.5px;word-break:keep-all;margin-bottom:5px}
.rev .a{font-weight:700;font-size:13.5px;color:var(--good)}
.rev .a s{color:var(--bad);opacity:.7;margin-right:6px}
.rev .w{color:var(--muted);font-size:13px;margin-top:4px;line-height:1.5}.rev .w b{color:var(--ink)}
.allgood{background:var(--panel);border:1px solid color-mix(in srgb,var(--good) 40%,var(--line));border-radius:12px;padding:18px;text-align:center;font-weight:700;color:var(--good);margin-bottom:22px}
.tglabel{font-weight:700;font-size:12px;color:var(--muted)}
.mono{font-variant-numeric:tabular-nums}
@media(max-width:400px){.match{gap:7px}}
</style>
</head>
<body>
<div class="blob"></div>
<div class="app">
  <div class="top">
    <div class="logo">Grammar<b>·</b>Review</div>
    <div class="grow"></div>
    <button class="iconbtn" id="sound" title="소리" onclick="G.toggleSound()">🔊</button>
    <button class="iconbtn" id="theme" title="라이트/다크" onclick="G.toggleTheme()">☀️</button>
  </div>

  <div class="hud" id="hud">
    <span class="stage"><span class="e" id="hE">⏮️</span><span id="hN">과거</span></span>
    <span class="grow"></span>
    <span class="streak" id="hStreak">연속 3</span>
    <span class="cnt">정답 <b id="hCor">0</b> · 문항 <b id="hQ">1</b>/<span id="hT">7</span></span>
  </div>
  <div class="bar" id="barwrap"><i id="bar"></i></div>

  <!-- START -->
  <section class="screen on" id="s-start">
    <div class="hero">
      <div class="kick">S20 – 24 총복습</div>
      <h1>영어 복습<br>아케이드</h1>
      <div class="stagelist">
        <div class="sl"><span class="num">1</span><i style="background:#e8912a"></i>과거</div>
        <div class="sl"><span class="num">2</span><i style="background:#1fb789"></i>현재완료</div>
        <div class="sl"><span class="num">3</span><i style="background:#2f8fe6"></i>미래</div>
        <div class="sl"><span class="num">4</span><i style="background:#e0518b"></i>실수 잡기</div>
        <div class="sl"><span class="num">5</span><i style="background:#8b6fe0"></i>표현</div>
        <div class="sl"><span class="num">6</span><i style="background:#e5533a"></i>종합</div>
      </div>
    </div>
    <div class="startzone"><button class="btn" onclick="G.start()">시작하기</button></div>
  </section>

  <!-- PLAY -->
  <section class="screen" id="s-play">
    <div class="qhead"><span class="tag" id="qtag">고르기</span><span class="n" id="qn">1 / 7</span></div>
    <div id="stage"></div>
    <div class="fb" id="fb"><div class="h" id="fbh"></div><div class="why" id="fbw"></div></div>
    <div class="nav">
      <button class="btn sec back" id="backb" style="display:none" onclick="G.back()">← 이전</button>
      <button class="btn fwd" id="fwdb" style="display:none" onclick="G.fwd()">다음</button>
    </div>
  </section>

  <!-- RESULTS -->
  <section class="screen res" id="s-res">
    <h2 id="rTitle">복습 리포트</h2>
    <div class="lead" id="rLead"></div>
    <div class="kpis">
      <div class="kpi"><div class="v mono" id="rAcc">0%</div><div class="l">정답률</div></div>
      <div class="kpi"><div class="v mono" id="rCor">0/43</div><div class="l">맞힌 문항</div></div>
      <div class="kpi"><div class="v mono" id="rTime">0:00</div><div class="l">소요 시간</div></div>
    </div>
    <div class="sec-t">스테이지별 정답률</div>
    <div class="sbars" id="rBars"></div>
    <div class="sec-t" id="rRevT">다시 볼 문항</div>
    <div id="rReview"></div>
    <div class="row" style="margin-top:8px">
      <button class="btn sec" style="flex:0 0 auto;width:auto;padding:15px 18px" onclick="G.home()">처음으로</button>
      <button class="btn" onclick="G.start()">다시 도전</button>
    </div>
  </section>
</div>

<button class="dbg" id="dbg" onclick="G.skip()">⏭ 다음 (디버그)</button>

<div class="overlay" id="ov"><div class="clear">
  <div class="big" id="ovBig">Stage Clear</div>
  <div class="ring" id="ovRing"><b id="ovPct">100%</b><span>정답률</span></div>
  <div class="sub" id="ovSub"></div>
  <button class="btn" id="ovNext" onclick="G.afterClear()">다음 스테이지</button>
</div></div>

<script>
/* ===== CONTENT (S20–24) — types interleaved for variety ===== */
const STAGES=[
{id:1,name:"과거",e:"⏮️",c:"#e8912a",qs:[
  {t:"choice",p:"알맞은 것",s:"Yesterday I ___ to the gym.",o:["go","went","gone"],a:1,why:"어제(과거)라 <b>went</b>. go는 원형."},
  {t:"mistake",tokens:["I","was","take","the","bus","."],bad:2,fix:"I <s>was take</s> took the bus.",why:"‘was + 원형’은 없는 형태. 과거 사실이면 <b>took</b>."},
  {t:"listen",text:"I didn't do much.",o:["I don't do much.","I didn't do much.","I did do much."],a:1,why:"didn’t는 ‘디든(트)’처럼 뭉개져 들립니다."},
  {t:"blank",s:"I ___ eat breakfast today.",o:["didn't","don't","wasn't"],a:0,fill:"didn't",why:"과거 부정 = <b>didn't</b> + 원형."},
  {t:"build",ko:"나 어제 버스 탔어.",ans:["I","took","the","bus","yesterday"],why:"take→took. 과거는 동사를 과거형으로."},
  {t:"choice",p:"진행 중이던 일",s:"I ___ TV when you called.",o:["watch","watched","was watching"],a:2,why:"그때 하던 중 = <b>was + ~ing</b>."},
  {t:"choice",p:"의문문",s:"___ you call me last night?",o:["Do","Did","Are"],a:1,why:"과거 의문문 = <b>Did</b> + 원형."},
]},

const TYPE_LABEL={choice:"고르기",blank:"빈칸",listen:"듣기",mistake:"틀린 곳",build:"문장 배열",match:"짝 맞추기",sort:"분류"};

/* ===== ENGINE ===== */
const $=s=>document.querySelector(s);
const DEBUG=new URLSearchParams(location.search).has('debug'); // ?debug=1 일 때만 스킵버튼
const cleanFix=f=>f.replace(/<s>.*?<\/s>\s*/g,'').replace(/<[^>]+>/g,'').trim();
function correctText(q){
  if(['choice','blank','listen'].includes(q.t))return q.o[q.a];
  if(q.t==='mistake')return cleanFix(q.fix);
  if(q.t==='build')return q.ans.join(' ');
  if(q.t==='match')return q.pairs.map(p=>p.l+' = '+p.r).join(' · ');
  if(q.t==='sort')return q.items.map(it=>it.t+' → '+q.buckets.find(b=>b.k===it.k).label).join(' · ');
  return '';
}
function qLabel(q){
  if(q.t==='listen')return '🔊 '+q.text;
  if(q.s)return q.s;
  if(q.t==='mistake')return q.tokens.join(' ');
  if(q.t==='build')return q.ko;
  if(q.t==='match')return '표현 ↔ 뜻 짝 맞추기';
  if(q.t==='sort')return q.p;
  return q.p||'';
}

const G={
  si:0,qi:0,streak:0,sound:true,startAt:0,
  ans:[],           // ans[si][qi] = {correct, my, right, why, label}
  qWrong:false,

  setAcc(hex){document.documentElement.style.setProperty('--acc',hex);},
  show(id){document.querySelectorAll('.screen').forEach(e=>e.classList.remove('on'));$('#'+id).classList.add('on');},

  toggleTheme(){const r=document.documentElement;const light=r.getAttribute('data-theme')==='light';
    r.setAttribute('data-theme',light?'dark':'light');$('#theme').textContent=light?'☀️':'🌙';},
  toggleSound(){this.sound=!this.sound;$('#sound').textContent=this.sound?'🔊':'🔇';
    if(this.sound&&this.ac&&this.ac.resume)this.ac.resume();},

  home(){this.show('s-start');$('#hud').style.display='none';$('#barwrap').style.display='none';},
  start(){
    this.si=0;this.qi=0;this.streak=0;this.startAt=Date.now();
    this.ans=STAGES.map(s=>[]);
    $('#hud').style.display='flex';$('#barwrap').style.display='block';
    this.loadStage();
  },
  loadStage(){const st=STAGES[this.si];this.qi=this.ans[this.si].length;this.setAcc(st.c);
    $('#hE').textContent=st.e;$('#hN').textContent=st.name;
    this.show('s-play');this.render();},

  updHUD(){
    const st=STAGES[this.si];
    $('#hCor').textContent=this.ans.reduce((a,arr)=>a+arr.filter(x=>x.correct).length,0);
    $('#hQ').textContent=this.qi+1;$('#hT').textContent=st.qs.length;
    const s=$('#hStreak');if(this.streak>=2){s.textContent='연속 '+this.streak;s.classList.add('on');}else s.classList.remove('on');
    let done=0,tot=0;STAGES.forEach((x,i)=>{tot+=x.qs.length;done+=(i<this.si?x.qs.length:(i===this.si?this.ans[i].length:0));});
    $('#bar').style.width=(done/tot*100)+'%';
  },

  render(){
    const st=STAGES[this.si],q=st.qs[this.qi],done=this.ans[this.si][this.qi];
    $('#qtag').textContent=TYPE_LABEL[q.t];$('#qn').textContent=(this.qi+1)+' / '+st.qs.length;
    $('#fb').className='fb';$('#stage').innerHTML='';
    $('#backb').style.display=this.qi>0?'block':'none';
    this.updHUD();
    if(done){this.renderReview(q,done);return;}
    this.qWrong=false;$('#fwdb').style.display='none';
    this['r_'+q.t](q,$('#stage'));
  },

  renderReview(q,done){
    const wrap=$('#stage');
    wrap.innerHTML=`<div class="recap"><span class="badge ${done.correct?'ok':'no'}">${done.correct?'맞힘':'틀림'}</span>
      <div class="q">${qLabel(q)}</div>
      ${done.my&&!done.correct?`<div class="line a-no"><span class="ic">✗</span><span>내 답: ${done.my}</span></div>`:''}
      <div class="line a-ok"><span class="ic">✓</span><span>정답: ${done.right}</span></div>
      <div class="why">${done.why}</div></div>`;
    $('#fwdb').style.display='block';$('#fwdb').textContent=(this.qi<STAGES[this.si].qs.length-1)?'다음':'스테이지 완료';
  },

  /* ---- renderers ---- */
  r_choice(q,box){
    box.innerHTML=`<div class="card">${q.p?`<p class="prompt">${q.p}</p>`:''}${q.s?`<div class="sent">${q.s.replace('___','<span class="bk">?</span>')}</div>`:''}<div class="opts" id="opts"></div></div>`;
    this.mkOpts(q,$('#opts'));
  },
  r_blank(q,box){
    box.innerHTML=`<div class="card"><p class="prompt">빈칸에 알맞은 것</p><div class="sent" id="bs">${q.s.replace('___','<span class="bk">___</span>')}</div><div class="opts" id="opts"></div></div>`;
    this.mkOpts(q,$('#opts'),()=>{$('#bs').innerHTML=q.s.replace('___',`<span class="bk fill">${q.fill}</span>`);});
  },
  r_listen(q,box){
    box.innerHTML=`<div class="card"><p class="prompt">듣고, 들린 문장 고르기</p>
      <div class="listen"><button class="spk" id="spk">🔊</button><div class="h">눌러서 듣기 (여러 번 가능)</div></div>
      <div class="opts" id="opts" style="margin-top:16px"></div></div>`;
    const play=()=>{if(!this.sound){alert('상단 🔊로 소리를 켜주세요');return;}this.say(q.text);};
    $('#spk').onclick=play;setTimeout(play,300);
    this.mkOpts(q,$('#opts'),null,true);
  },
  mkOpts(q,box,onCorrect,isNum){
    q.o.forEach((o,i)=>{const b=document.createElement('button');b.className='opt';
      b.innerHTML=`<span class="k">${isNum?(i+1):String.fromCharCode(65+i)}</span> ${o}`;
      b.onclick=()=>{if(this.locked)return;this.locked=true;
        [...box.children].forEach((x,k)=>{if(k===q.a)x.classList.add('correct');else if(k===i)x.classList.add('wrong');else x.classList.add('mute');});
        if(i===q.a&&onCorrect)onCorrect();
        this.finish(i===q.a,q,q.o[i]);};
      box.appendChild(b);});
    this.locked=false;
  },
  r_mistake(q,box){
    box.innerHTML=`<div class="card"><p class="prompt">틀린 단어를 하나 고르세요</p><div class="tokens" id="tk"></div><div class="mfix" id="mf">${q.fix}</div></div>`;
    const tk=$('#tk');this.locked=false;const toks=[];
    q.tokens.forEach((w,i)=>{const punct=/^[.,?!]$/.test(w);
      const sp=document.createElement('span');sp.className='tok';sp.textContent=w;toks[i]=sp;
      sp.onclick=()=>{if(this.locked)return;this.locked=true;
        toks.forEach(t=>t.style.pointerEvents='none');
        toks[q.bad].classList.add('hit');            // 실제 오류 단어 표시(취소선)
        if(i!==q.bad)sp.classList.add('miss');        // 잘못 고른 단어 표시
        $('#mf').classList.add('on');
        this.finish(i===q.bad,q,i===q.bad?'맞게 찾음':'‘'+w+'’ 선택');};
      tk.appendChild(sp);if(!punct)tk.appendChild(document.createTextNode(' '));});
  },
  r_build(q,box){
    box.innerHTML=`<div class="card"><div class="ko">${q.ko}</div><div class="tray" id="tray"></div><div class="bank" id="bank"></div></div>`;
    const tray=$('#tray'),bank=$('#bank'),picked=[];this.locked=false;
    [...q.ans.keys()].sort(()=>Math.random()-.5).forEach(idx=>{
      const t=document.createElement('div');t.className='tile';t.textContent=q.ans[idx];
      t.onclick=()=>{if(this.locked)return;t.classList.add('used');picked.push(idx);
        const tt=document.createElement('div');tt.className='tile';tt.textContent=q.ans[idx];
        tt.onclick=()=>{if(this.locked)return;tt.remove();t.classList.remove('used');picked.splice(picked.indexOf(idx),1);};
        tray.appendChild(tt);
        if(picked.length===q.ans.length){this.locked=true;
          const ok=picked.every((v,k)=>q.ans[v]===q.ans[k]);
          if(!ok)tray.querySelectorAll('.tile').forEach(x=>x.style.borderColor='var(--bad)');
          this.finish(ok,q,picked.map(v=>q.ans[v]).join(' '));}};
      bank.appendChild(t);});
  },
  r_match(q,box){
    box.innerHTML=`<div class="card"><p class="prompt">표현과 뜻을 짝지으세요</p><div class="match"><div class="mcol" id="mL"></div><div class="mcol" id="mR"></div></div></div>`;
    const L=$('#mL'),R=$('#mR');let sel=null,done=0;this.qWrong=false;
    q.pairs.forEach((p,i)=>{const e=document.createElement('div');e.className='mitem';e.textContent=p.l;e.dataset.k=i;
      e.onclick=()=>{if(e.classList.contains('done'))return;document.querySelectorAll('.mitem.sel').forEach(x=>x.classList.remove('sel'));e.classList.add('sel');sel=e;};L.appendChild(e);});
    [...q.pairs].sort(()=>Math.random()-.5).forEach(p=>{const e=document.createElement('div');e.className='mitem';e.textContent=p.r;
      e.onclick=()=>{if(!sel||e.classList.contains('done'))return;
        if(q.pairs[sel.dataset.k].r===p.r){sel.classList.add('done');e.classList.add('done');sel.classList.remove('sel');sel=null;this.ping('ok');
          if(++done===q.pairs.length)this.finish(!this.qWrong,q,'짝 맞추기 완료');}
        else{e.classList.add('nope');this.ping('no');this.qWrong=true;this.breakStreak();setTimeout(()=>e.classList.remove('nope'),380);}};R.appendChild(e);});
  },
  r_sort(q,box){
    box.innerHTML=`<div class="card"><p class="prompt">${q.p}</p><div class="pool" id="pool"></div><div class="buckets" id="bk" style="grid-template-columns:repeat(${q.buckets.length},1fr)"></div></div>`;
    const pool=$('#pool'),bk=$('#bk');let sel=null,done=0;this.qWrong=false;
    q.items.map((it,i)=>({it,i})).sort(()=>Math.random()-.5).forEach(({it})=>{
      const e=document.createElement('div');e.className='sortitem';e.textContent=it.t;e.dataset.k=it.k;
      e.onclick=()=>{if(e.classList.contains('locked'))return;document.querySelectorAll('.sortitem.sel').forEach(x=>x.classList.remove('sel'));e.classList.add('sel');sel=e;};
      pool.appendChild(e);});
    q.buckets.forEach(b=>{const z=document.createElement('div');z.className='bucket';z.innerHTML=`<div class="bl">${b.label}</div><div class="drops"></div>`;
      z.onclick=()=>{if(!sel)return;
        if(sel.dataset.k===b.k){sel.classList.remove('sel');sel.classList.add('locked');z.querySelector('.drops').appendChild(sel);this.ping('ok');sel=null;
          if(++done===q.items.length)this.finish(!this.qWrong,q,'분류 완료');}
        else{z.classList.add('flash');this.ping('no');this.qWrong=true;this.breakStreak();setTimeout(()=>z.classList.remove('flash'),380);}};
      bk.appendChild(z);});
  },

  /* ---- resolve ---- */
  finish(correct,q,my){
    this.ans[this.si][this.qi]={correct,my,right:correctText(q),why:q.why,label:qLabel(q)};
    if(correct){this.streak++;this.ping('ok');}else{this.streak=0;this.ping('no');}
    const f=$('#fb');f.className='fb on '+(correct?'ok':'no');
    $('#fbh').textContent=correct?'정답':'오답';$('#fbw').innerHTML=q.why;
    $('#fwdb').style.display='block';$('#fwdb').textContent=(this.qi<STAGES[this.si].qs.length-1)?'다음':'스테이지 완료';
    this.updHUD();
  },
  breakStreak(){this.streak=0;this.updHUD();},

  back(){if(this.qi>0){this.qi--;this.render();}},
  fwd(){const st=STAGES[this.si];
    if(this.qi<st.qs.length-1){this.qi++;this.render();return;}
    // last question of stage answered → clear
    if(this.ans[this.si].length===st.qs.length)this.stageClear();
  },
  skip(){ // 디버그 전용: 답 안 해도 다음/다음 스테이지로 쭉쭉
    if(!$('#s-play').classList.contains('on'))return;
    const st=STAGES[this.si];
    if(this.qi<st.qs.length-1)this.qi++;
    else if(this.si<STAGES.length-1){this.si++;this.qi=0;this.setAcc(STAGES[this.si].c);$('#hE').textContent=STAGES[this.si].e;$('#hN').textContent=STAGES[this.si].name;}
    else{this.results();return;}
    this.render();
  },

  stageClear(){
    const arr=this.ans[this.si],cor=arr.filter(x=>x.correct).length,rate=cor/arr.length;
    const last=this.si===STAGES.length-1;const col=STAGES[this.si].c;
    $('#ovBig').textContent=last?'모두 완료':STAGES[this.si].name+' 완료';
    $('#ovPct').textContent=Math.round(rate*100)+'%';
    $('#ovRing').style.background=`conic-gradient(${col} ${rate*360}deg, var(--panel2) 0)`;
    $('#ovRing').style.padding='8px';
    // inner mask
    $('#ovRing').innerHTML=`<div style="position:absolute;inset:8px;border-radius:50%;background:var(--panel)"></div><b style="position:relative">${Math.round(rate*100)}%</b><span>정답률</span>`;
    $('#ovSub').innerHTML=`${arr.length}문항 중 <b>${cor}</b>개 정답`;
    $('#ovNext').textContent=last?'결과 보기':'다음 스테이지';
    $('#ov').classList.add('on');
  },
  afterClear(){$('#ov').classList.remove('on');
    if(this.si<STAGES.length-1){this.si++;this.loadStage();}else this.results();},

  results(){
    $('#hud').style.display='none';$('#barwrap').style.display='none';
    let cor=0,tot=0;this.ans.forEach(a=>{cor+=a.filter(x=>x.correct).length;tot+=a.length;});
    const acc=Math.round(cor/tot*100);
    const secs=Math.round((Date.now()-this.startAt)/1000),mm=Math.floor(secs/60),ss=String(secs%60).padStart(2,'0');
    $('#rAcc').textContent=acc+'%';$('#rCor').textContent=cor+'/'+tot;$('#rTime').textContent=mm+':'+ss;
    // weakest stage (neutral, factual)
    let weak=null;STAGES.forEach((s,i)=>{const r=this.ans[i].filter(x=>x.correct).length/this.ans[i].length;if(weak===null||r<weak.r)weak={i,r};});
    $('#rLead').innerHTML=(cor===tot)?'전 문항 정답입니다.':`가장 많이 틀린 곳: <b>${STAGES[weak.i].e} ${STAGES[weak.i].name}</b> (${Math.round(weak.r*100)}%)`;
    // per-stage bars
    $('#rBars').innerHTML=STAGES.map((s,i)=>{const a=this.ans[i],c=a.filter(x=>x.correct).length,r=Math.round(c/a.length*100);
      return `<div class="sbar"><span class="nm"><span>${s.e}</span>${s.name}</span><span class="track"><i style="width:${r}%;background:${s.c}"></i></span><span class="pc mono">${c}/${a.length}</span></div>`;}).join('');
    // review missed
    const missed=[];this.ans.forEach((a,i)=>a.forEach(x=>{if(!x.correct)missed.push(x);}));
    $('#rRevT').textContent='다시 볼 문항 ('+missed.length+')';
    if(!missed.length){$('#rReview').innerHTML=`<div class="allgood">틀린 문항이 없습니다 ✓</div>`;}
    else{$('#rReview').className='review';$('#rReview').innerHTML=missed.map(m=>
      `<div class="rev"><div class="q">${m.label}</div><div class="a">${m.my&&m.my!=='맞게 찾음'?`<s>${m.my}</s>`:''}${m.right}</div><div class="w">${m.why}</div></div>`).join('');}
    this.show('s-res');this.ping('done');
  },

  /* ---- TTS + sfx ---- */
  say(text){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=.9;
    const vs=speechSynthesis.getVoices();const v=vs.find(x=>/en-US/i.test(x.lang)&&/(Google US|Samantha|Natural)/i.test(x.name))||vs.find(x=>/en-US/i.test(x.lang))||vs.find(x=>/en/i.test(x.lang));
    if(v)u.voice=v;const s=$('#spk');if(s){s.classList.add('play');u.onend=()=>s.classList.remove('play');}
    speechSynthesis.speak(u);}catch(e){}},
  ac:null,
  ping(k){if(!this.sound)return;try{this.ac=this.ac||new(window.AudioContext||window.webkitAudioContext)();
    const seq={ok:[[620,0],[820,.07]],no:[[200,0]],done:[[523,0],[659,.09],[784,.18],[1046,.28]]}[k]||[[600,0]];
    seq.forEach(([f,t])=>{const o=this.ac.createOscillator(),g=this.ac.createGain();o.type=k==='no'?'sine':'triangle';o.frequency.value=f;
      o.connect(g);g.connect(this.ac.destination);const s=this.ac.currentTime+t;
      g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(.12,s+.02);g.gain.exponentialRampToValueAtTime(.0001,s+.15);
      o.start(s);o.stop(s+.17);});}catch(e){}},
};
if(DEBUG)document.getElementById('dbg').style.display='block';
if('speechSynthesis'in window){speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices();speechSynthesis.getVoices();}
if(window.matchMedia&&matchMedia('(prefers-color-scheme:light)').matches){document.documentElement.setAttribute('data-theme','light');document.getElementById('theme').textContent='🌙';}
</script>
</body>
